<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Вход — аналитика обучения</title>
<style>
  :root { --bg:#f5f7fa; --card:#fff; --ink:#18202e; --muted:#5f6b7d; --line:#dfe4ec; --accent:#2a78d6; --err:#c2412d; color-scheme:light; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; padding:24px 16px; }
  form { width:100%; max-width:360px; background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:28px 24px; display:flex; flex-direction:column; gap:14px; box-shadow:0 12px 32px -20px rgba(24,32,46,.35); }
  h1 { margin:0; font-size:21px; } p { margin:0; color:var(--muted); font-size:14px; }
  label { display:flex; flex-direction:column; gap:6px; font-size:14px; font-weight:600; }
  input[type=text], input[type=password] { font:inherit; padding:10px 12px; border:1px solid var(--line); border-radius:10px; }
  input:focus { outline:2px solid var(--accent); outline-offset:0; border-color:var(--accent); }
  .row { flex-direction:row; align-items:center; gap:8px; font-weight:400; color:var(--muted); }
  button { font:inherit; font-weight:600; padding:11px; border:0; border-radius:10px; background:var(--accent); color:#fff; cursor:pointer; }
  button:disabled { opacity:.6; cursor:wait; }
  button:focus-visible { outline:3px solid var(--ink); outline-offset:2px; }
  #err { color:var(--err); font-size:14px; min-height:21px; }
</style>
</head>
<body>
<form id="f" autocomplete="on">

  <p>Закрытая страница. Введи логин и пароль, которые тебе выдали.</p>
  <label>Логин <input type="text" id="login" name="username" autocomplete="username" required></label>
  <label>Пароль <input type="password" id="password" name="password" autocomplete="current-password" required></label>
  <label class="row"><input type="checkbox" id="remember"> Запомнить на этом устройстве</label>
  <button id="go" type="submit">Войти</button>
  <div id="err" role="alert"></div>
</form>

<script>
(async () => {
  const P = JSON.parse(document.getElementById('payload').textContent);
  const u8 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const STORE = 'funnel-key-' + P.s.slice(0, 8);
  const subtle = crypto.subtle;

  async function open(key) {
    const buf = await subtle.decrypt({ name: 'AES-GCM', iv: u8(P.i) }, key, u8(P.c));
    const html = new TextDecoder().decode(buf);
    document.open(); document.write(html); document.close();
  }

  // ключ, сохранённый галочкой «Запомнить»
  try {
    const saved = localStorage.getItem(STORE);
    if (saved) {
      const key = await subtle.importKey('raw', u8(saved), 'AES-GCM', false, ['decrypt']);
      try { await open(key); return; } catch { localStorage.removeItem(STORE); }
    }
  } catch {}

  const f = document.getElementById('f'), btn = document.getElementById('go'), err = document.getElementById('err');
  f.addEventListener('submit', async e => {
    e.preventDefault();
    err.textContent = ''; btn.disabled = true; btn.textContent = 'Проверяю…';
    try {
      const login = document.getElementById('login').value.trim().toLowerCase();
      const pass = document.getElementById('password').value;
      const base = await subtle.importKey('raw', new TextEncoder().encode(login + '\n' + pass), 'PBKDF2', false, ['deriveKey']);
      const key = await subtle.deriveKey({ name: 'PBKDF2', salt: u8(P.s), iterations: P.it, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
      await subtle.decrypt({ name: 'AES-GCM', iv: u8(P.i) }, key, u8(P.c));
      if (document.getElementById('remember').checked) {
        try {
          const raw = new Uint8Array(await subtle.exportKey('raw', key));
          localStorage.setItem(STORE, btoa(String.fromCharCode(...raw)));
        } catch {}
      }
      await open(key);
    } catch {
      err.textContent = 'Неверный логин или пароль';
      btn.disabled = false; btn.textContent = 'Войти';
    }
  });
})();
</script>
